# Permissions for Knowledge Notes custom commands
# This file defines all the Tauri commands available to the frontend

[[permission]]
identifier = "allow-all-commands"
description = "Allow all custom commands for the application"
commands.allow = [
  "create_note",
  "get_note",
  "update_note",
  "delete_note",
  "list_notes",
  "pin_note",
  "unpin_note",
  "archive_note",
  "restore_note",
  "add_tag",
  "remove_tag",
  "search_notes",
  "advanced_search",
  "get_notes_by_tag",
  "get_graph",
  "get_subgraph",
  "link_notes",
  "get_neighbors",
  "suggest_related_notes",
  "analyze_graph",
  "get_insights",
  "find_orphan_notes",
  "find_hub_notes",
  "get_database_stats",
  "optimize_database"
]
